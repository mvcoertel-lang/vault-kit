<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault-Index</title>
<style>
:root{
  --bg:#181c24; --bg2:#141821; --panel:#20252f; --panel2:#262c38;
  --hair:#2f3644; --hair2:#3a4252;
  --tx:#eae7e0; --mut:#9aa3ae; --quiet:#8f98a4;
  --cream:#f2ece0; --rust:#c25b4e;
  --memory:#d8a15c; --skills:#7fa8d9; --projekte:#8fbf88; --anweisungen:#b58ac9;
  --wl:#e0b77a; --nen:#7f8da2; --str:#b58ac9;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Charter",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
#stage{position:fixed; inset:0; cursor:grab}
#stage.drag{cursor:grabbing}
#sky{width:100%; height:100%; display:block; touch-action:none}

/* Kopfleiste mit Pfad */
.bar{position:fixed; top:0; left:0; right:0; height:3.5rem; display:flex; align-items:center;
  gap:1.4rem; padding:0 clamp(0.9rem,2.5vw,1.6rem); z-index:5; pointer-events:none}
.bar::before{content:''; position:absolute; left:0; right:0; top:0; height:5.2rem; z-index:-1;
  background:linear-gradient(180deg,var(--bg) 52%,transparent)}
.bar > *{pointer-events:auto}
.brand{display:flex; align-items:center; gap:0.6rem; font-family:var(--serif); flex:none;
  letter-spacing:0.22em; font-size:0.78rem; text-transform:uppercase; color:var(--tx)}
.brand svg{width:15px; height:19px}
.crumbs{display:flex; align-items:center; gap:0.45rem; min-width:0; overflow:hidden;
  font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--quiet)}
.crumbs button{background:none; border:0; padding:0.4rem 0; color:var(--quiet); cursor:pointer;
  font:inherit; letter-spacing:inherit; text-transform:inherit; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:16rem}
.crumbs button:hover{color:var(--tx)}
.crumbs button.cur{color:var(--tx); cursor:default}
.crumbs .sep{opacity:0.5}
.back{margin-left:auto; flex:none; background:none; border:0; color:var(--mut); font-size:0.68rem;
  letter-spacing:0.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans);
  padding:0.5rem 0; opacity:0; pointer-events:none; transition:opacity 260ms cubic-bezier(0.16,1,0.3,1)}
.back.on{opacity:1; pointer-events:auto}
.back:hover{color:var(--tx)}
@media (max-width:600px){ .back .bt{display:none} .brand{letter-spacing:0.12em} .bar{gap:0.8rem}
  .crumbs button{max-width:calc(100vw - 10rem)} }

/* Knöpfe */
.pill{position:fixed; z-index:5; border:1px solid var(--hair2); background:var(--panel);
  color:var(--tx); border-radius:999px; padding:0.62rem 1.15rem; font-size:0.66rem;
  letter-spacing:0.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans);
  transition:border-color 200ms, background 200ms}
.pill:hover{border-color:var(--quiet); background:var(--panel2)}
#register{right:clamp(0.9rem,2.5vw,1.6rem); bottom:clamp(0.9rem,2.5vw,1.6rem)}
.zoom{position:fixed; z-index:5; left:clamp(0.9rem,2.5vw,1.6rem);
  bottom:clamp(0.9rem,2.5vw,1.6rem); display:flex; align-items:center; gap:1px;
  background:var(--panel); border:1px solid var(--hair2); border-radius:999px; overflow:hidden}
.zoom button{background:none; border:0; color:var(--mut); cursor:pointer; font-family:var(--sans);
  padding:0.55rem 0.85rem; font-size:0.9rem; line-height:1; transition:color 180ms, background 180ms}
.zoom button:hover{color:var(--tx); background:var(--panel2)}
.zoom .lvl{color:var(--quiet); font-size:0.62rem; letter-spacing:0.1em; padding:0 0.5rem;
  font-variant-numeric:tabular-nums; min-width:3.4rem; text-align:center}
.livei{flex:none; display:inline-flex; align-items:center; gap:0.45rem; background:none; border:1px solid var(--hair2);
  border-radius:999px; padding:0.32rem 0.7rem 0.32rem 0.6rem; color:var(--mut); font-family:var(--sans); font-size:0.62rem;
  letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; transition:color 160ms, border-color 160ms}
.livei[hidden]{display:none}
.livei:hover,.livei[aria-expanded="true"]{color:var(--tx); border-color:var(--quiet)}
.livei:focus{outline:none} .livei:focus-visible{outline:1px solid var(--quiet); outline-offset:2px}
/* Handy: nur Punkt und Zahl ohne Rahmen, damit der Pfad lesbar bleibt */
@media (max-width:600px){ .livei{padding:0.3rem 0.2rem; gap:0.3rem; border-color:transparent} .livei .lwd{display:none} .bar{gap:0.62rem} }
.ldot{width:7px; height:7px; border-radius:50%; background:#8fbf88; box-shadow:0 0 0 0 rgba(143,191,136,0.6);
  animation:ldot 2s ease-out infinite; flex:none}
@keyframes ldot{70%{box-shadow:0 0 0 6px rgba(143,191,136,0)} 100%{box-shadow:0 0 0 0 rgba(143,191,136,0)}}
.livebox{position:fixed; z-index:6; top:3.4rem; left:1rem; width:min(20rem, calc(100vw - 1.5rem)); background:var(--panel);
  border:1px solid var(--hair2); border-radius:10px; padding:0.4rem 0.3rem 0.5rem; font-family:var(--sans);
  box-shadow:0 14px 36px rgba(0,0,0,0.45)}
.livebox[hidden]{display:none}
.livebox .lh{font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--quiet); padding:0.25rem 0.55rem 0.35rem}
.livebox .lrow{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:0.55rem; width:100%; text-align:left; background:none;
  border:0; border-radius:7px; cursor:pointer; padding:0.34rem 0.55rem; font:inherit; color:var(--tx)}
.livebox .lrow:hover,.livebox .lrow:focus-visible{background:var(--panel2); outline:none}
.livebox .lrow i{width:7px; height:7px; border-radius:50%; margin-top:0.34rem; grid-row:span 2}
.livebox .lt{font-size:0.76rem; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.livebox .lm{font-size:0.65rem; color:var(--quiet); line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.livebox .lnote{margin:0.4rem 0.55rem 0; padding-top:0.45rem; border-top:1px solid var(--hair2); font-size:0.64rem; line-height:1.45;
  color:var(--quiet)}
.nav{position:fixed; top:50%; transform:translateY(-50%); z-index:4; background:none; border:0;
  color:var(--quiet); font-size:1.5rem; cursor:pointer; padding:1.2rem 0.9rem; line-height:1;
  transition:color 200ms}
.nav:hover{color:var(--tx)}
#prev{left:clamp(0.2rem,1.5vw,1rem)} #next{right:clamp(0.2rem,1.5vw,1rem)}
.nav[hidden]{display:none}

/* Legende unten */
.key{position:fixed; z-index:4; left:50%; transform:translateX(-50%);
  bottom:clamp(1.1rem,2.8vw,1.85rem); display:flex; gap:0.4rem 1.2rem; flex-wrap:wrap;
  justify-content:center; max-width:min(46rem,calc(100vw - 22rem)); pointer-events:none;
  font-size:0.68rem; letter-spacing:0.04em; color:var(--mut);
  background:color-mix(in srgb, var(--bg) 88%, transparent); padding:0.3rem 0.7rem; border-radius:6px}
.key span{display:inline-flex; align-items:center; gap:0.4rem; white-space:nowrap}
.key svg{flex:none}
@media (max-width:760px){ .key{display:none} }

/* Tooltip */
.tip{position:fixed; z-index:7; pointer-events:none; max-width:22rem; background:var(--panel);
  border:1px solid var(--hair2); border-radius:9px; padding:0.6rem 0.75rem 0.65rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.35); opacity:0; transform:translateY(4px);
  transition:opacity 140ms, transform 140ms}
.tip.on{opacity:1; transform:none}
.tip b{display:block; font-family:var(--serif); font-weight:600; font-size:0.92rem; line-height:1.25;
  color:var(--tx); overflow-wrap:anywhere}
.tip .k{font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--quiet);
  margin:0.25rem 0 0.35rem}
.tip .k + .k{margin-top:-0.2rem}
.tip .k span{white-space:nowrap}
.tip p{margin:0; font-size:0.74rem; line-height:1.45; color:var(--mut)}
.tip p.s{color:var(--tx); font-size:0.78rem; line-height:1.5}
.tip .k i,.tag2 i{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:0.4rem;
  vertical-align:0.05em}
.bds{display:flex; flex-wrap:wrap; gap:0.3rem; margin:0.05rem 0 0.45rem}
.bd{font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; border-radius:999px;
  padding:0.16rem 0.5rem; border:1px solid var(--hair2); color:var(--cream); white-space:nowrap}
.bd.core{background:var(--cream); color:#14181f; border-color:var(--cream); font-weight:600}

/* Themenleiste in der Abteilung: Anordnung und Filter */
.themes{position:fixed; z-index:5; top:3.35rem; left:1rem; right:1rem; display:flex;
  flex-wrap:wrap; justify-content:center; align-items:center; gap:0.4rem 0.3rem; pointer-events:none}
/* bricht die Zeile um, stehen beide Zeilen bündig links statt einer zentrierten Restzeile */
.themes.wrapped{justify-content:flex-start}
.themes > *{pointer-events:auto}
.themes[hidden]{display:none}
.seg{display:inline-flex; border:1px solid var(--hair2); border-radius:999px; overflow:hidden;
  background:var(--panel); margin-right:0.45rem; flex:none}
.seg button{background:none; border:0; color:var(--mut); font-family:var(--sans); font-size:0.6rem;
  letter-spacing:0.14em; text-transform:uppercase; padding:0.45rem 0.66rem; cursor:pointer}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--panel2); color:var(--tx)}
.chip{display:inline-flex; align-items:center; gap:0.26rem; border:1px solid var(--hair2); flex:none;
  background:var(--panel); color:var(--mut); border-radius:999px; padding:0.28rem 0.46rem 0.28rem 0.38rem;
  font-size:0.67rem; cursor:pointer; font-family:var(--sans); white-space:nowrap;
  transition:border-color 160ms, color 160ms, opacity 160ms}
.chip i{width:8px; height:8px; border-radius:50%; background:var(--tc); flex:none}
.chip em{font-style:normal; color:var(--quiet); font-size:0.62rem; font-variant-numeric:tabular-nums}
.chip:hover{color:var(--tx); border-color:var(--quiet)}
.chip.on{color:var(--tx); border-color:var(--tc); background:var(--panel2)}
.themes.filtering .chip:not(.on){opacity:0.5}
.chip.zero{opacity:0.38}
/* Suche und Filter: in der Übersicht und in jeder Abteilung */
.fq{flex:none; width:12rem; background:var(--panel); border:1px solid var(--hair2); border-radius:999px;
  color:var(--tx); padding:0.38rem 0.85rem; font-size:0.72rem; font-family:var(--sans)}
.fq:focus{outline:none; border-color:var(--quiet)}
.fq::placeholder{color:var(--quiet)}
.fb{flex:none; position:relative; display:inline-flex; align-items:center; gap:0.4rem; border:1px solid var(--hair2); background:var(--panel);
  color:var(--mut); border-radius:999px; padding:0.42rem 0.85rem; font-size:0.6rem; letter-spacing:0.14em;
  text-transform:uppercase; cursor:pointer; font-family:var(--sans)}
.fb:hover,.fb.on,.fb[aria-expanded="true"]{color:var(--tx); border-color:var(--quiet)}
.fb b{position:absolute; top:-0.45rem; right:-0.35rem; font-weight:600; background:var(--cream); color:#14181f;
  border-radius:999px; padding:0.05rem 0.34rem; font-size:0.56rem; letter-spacing:0; min-width:1rem; text-align:center}
.fb b:empty{display:none}
.fcount{flex:none; font-size:0.68rem; color:var(--mut); font-variant-numeric:tabular-nums; width:5.8rem; text-align:right;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fcount.on{color:var(--tx)}
/* Desktop: Suche, Filter und Zähler stehen rechts in der Kopfleiste vor dem Zurück-Knopf (das Skript hängt
   sie je nach Breite um); der Zähler steht ganz links mit fester Breite, damit sein Erscheinen nichts verschiebt */
.fgrp{display:flex; align-items:center; gap:0.45rem; flex:none}
.fgrp[hidden]{display:none}
.bar .fgrp{margin-left:auto}
.bar .fgrp ~ .back{margin-left:0}
.tscroll{display:contents}
.tscroll[hidden]{display:none}
.seg{order:-1}
@media (max-width:1000px){ .fq{width:9.5rem} }
/* Beschreibung der Abteilung oder des gewählten Themas unter der Leiste; zwei Zeilen, Klick zeigt alles */
.tinfo{position:fixed; z-index:5; left:50%; transform:translateX(-50%); width:min(46rem,calc(100vw - 2rem));
  text-align:center; font-size:0.74rem; line-height:1.45; color:var(--mut); cursor:pointer; max-height:calc(2.9em + 0.4rem);
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  background:color-mix(in srgb, var(--bg) 88%, transparent); padding:0.2rem 0.65rem; border-radius:6px}
.tinfo b{color:var(--tx); font-weight:600; margin-right:0.3rem}
.tinfo b i{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:0.38rem; vertical-align:0.08em}
.tinfo.open{max-height:none; display:block; z-index:6; background:var(--panel); border:1px solid var(--hair2);
  border-radius:9px; padding:0.55rem 0.85rem; text-align:left; box-shadow:0 10px 30px rgba(0,0,0,0.35)}
.tinfo[hidden]{display:none}
.fpanel{position:fixed; z-index:6; width:min(31rem,calc(100vw - 1.5rem));
  max-height:calc(100vh - 8.5rem); overflow-y:auto; background:var(--panel); border:1px solid var(--hair2);
  border-radius:12px; padding:0.95rem 1.05rem 0.8rem; box-shadow:0 14px 40px rgba(0,0,0,0.45)}
.fpanel[hidden]{display:none}
.fsec{margin-bottom:0.95rem}
.fsec h4{margin:0 0 0.2rem; font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--tx); font-weight:600}
.fsec .fh{margin:0 0 0.5rem; font-size:0.7rem; line-height:1.45; color:var(--quiet)}
.fsec .chips{display:flex; flex-wrap:wrap; gap:0.35rem}
.frow{display:grid; grid-template-columns:6.4rem 1fr; align-items:start; gap:0.3rem 0.5rem; margin-bottom:0.5rem}
.frow .fdl{font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; padding-top:0.38rem}
.frow .chips{display:flex; flex-wrap:wrap; gap:0.35rem}
/* Fußzeile bleibt sichtbar, auch wenn das Feld scrollt */
.ffoot{display:flex; align-items:center; gap:1rem; border-top:1px solid var(--hair); position:sticky; bottom:-0.8rem;
  background:var(--panel); margin:0 -1.05rem -0.8rem; padding:0.7rem 1.05rem 0.8rem}
.ffoot span{margin-right:auto; font-size:0.72rem; color:var(--mut); font-variant-numeric:tabular-nums}
.ffoot button{background:none; border:0; color:var(--mut); font-family:var(--sans); font-size:0.62rem;
  letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; padding:0.3rem 0}
.ffoot button:hover{color:var(--tx)}
.ffoot button.ok{color:var(--cream)}
@media (max-width:760px){
  /* Handy: erste Zeile Suche und Filter fest, darunter Anordnung und Themen seitlich scrollend */
  .themes{left:0; right:0; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:0.45rem; padding:0 1rem}
  .fgrp{gap:0.4rem}
  .fq{flex:1; width:auto; min-width:0}
  .fcount{width:4.9rem; text-align:left}
  .tscroll{display:flex; align-items:center; gap:0.4rem; overflow-x:auto; scrollbar-width:none; margin:0 -1rem; padding:0 1rem}
  .tscroll::-webkit-scrollbar{display:none}
  .tscroll:not(.end){-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);
    mask-image:linear-gradient(90deg,#000 80%,transparent)}
  .tscroll.mid:not(.end){-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 80%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 80%,transparent)}
  .tscroll.mid.end{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%);
    mask-image:linear-gradient(90deg,transparent,#000 12%)}
  .seg{margin-right:0.2rem}
  .frow{grid-template-columns:1fr}
  .frow .fdl{padding-top:0}
}
@media (max-width:700px){
  .nav{top:auto; transform:none; bottom:calc(clamp(0.9rem,2.5vw,1.6rem) + 2.9rem); padding:0.35rem 0.85rem;
    font-size:1.15rem; background:var(--panel); border:1px solid var(--hair2); border-radius:999px}
  #prev{left:clamp(0.9rem,2.5vw,1.6rem)} #next{right:clamp(0.9rem,2.5vw,1.6rem)}
}
.tip .f{margin-top:0.4rem; font-size:0.66rem; color:var(--quiet)}

/* Graph */
.bgdots{pointer-events:none}
.node{cursor:pointer; transition:opacity 170ms}
.node:focus{outline:none}
.node:focus-visible .dot{stroke:var(--cream); stroke-width:1.6}
.node .hit{fill:transparent}
.dot{stroke-width:1.7; transition:stroke 160ms}
.dot.fill{fill:var(--c); stroke:none}
.dot.ring{fill:var(--bg); stroke:var(--c)}
.dot.dash{fill:var(--bg); stroke:var(--c); stroke-dasharray:2 2}
.dot.iso{fill:var(--quiet); fill-opacity:0.38; stroke:none}
.glow{fill:var(--c); opacity:0.13; pointer-events:none}
.node .sel{fill:none; stroke:var(--cream); stroke-width:1.2; opacity:0.9}
.node .ring2{fill:none; stroke:var(--cream); opacity:0.75}
.node.live .ring2{animation:actpulse 1.8s ease-in-out infinite}
@keyframes actpulse{50%{opacity:0.15}}
/* Live: laufende Sitzungen als Nerven, Impulse laufen beim Schreiben von der Sitzung weg, beim Lesen zu ihr hin */
.nerves{pointer-events:none; transition:opacity 170ms}
.nerve{fill:none; stroke-width:1.1; stroke-opacity:0.45; vector-effect:non-scaling-stroke; stroke-linecap:round}
.nerve.w{stroke-width:1.6; stroke-opacity:0.7}
.nglow{fill:none; stroke-width:7; stroke-opacity:0.07; vector-effect:non-scaling-stroke; stroke-linecap:round}
.nerve.dim{stroke-opacity:0.12} .nglow.dim{stroke-opacity:0.02}
.spark{opacity:0} .spark .sh{opacity:0.32} .spark .sc{fill:#fff6e4}
.trail{fill:none; stroke-linecap:round; opacity:0}
.spark.dim,.trail.dim{display:none}
.hovering .nerves{opacity:0.15}
.lhalo{fill:var(--c); opacity:0.24; pointer-events:none; animation:lbreath 2.4s ease-in-out infinite}
.node.lu .lhalo{opacity:0.13; animation:none}
@keyframes lbreath{50%{opacity:0.08}}
.lab{font-family:var(--sans); fill:var(--mut); pointer-events:none; paint-order:stroke;
  stroke:var(--bg); stroke-width:3px; stroke-linejoin:round; transition:opacity 160ms, fill 160ms}
.lab.up{letter-spacing:0.01em; font-size:11px}
.lab.row{font-size:11.5px; fill:var(--tx); stroke-width:0}
.lab.rad{font-size:10.5px; fill:var(--tx)}
.lab.ctr{font-family:var(--serif); font-size:18px; fill:var(--tx); font-weight:600}
.lab.kick{font-size:8.5px; letter-spacing:0.18em; text-transform:uppercase; fill:var(--quiet)}
.rmeta{font-size:10px; fill:var(--mut); font-variant-numeric:tabular-nums; pointer-events:none}
.lab.dl{font-size:10.5px; letter-spacing:0.01em}
.lab.row.core{fill:var(--cream); font-weight:600}
.lg{pointer-events:none; opacity:0; transition:opacity 160ms}
.lg.show{opacity:1}
/* Namen auf einem Schild brauchen keinen Rand; Safari zeichnet paint-order:stroke je Buchstabe,
   der Rand des nächsten Buchstabens löschte bis zu einem Drittel der Schrift */
.lg .lab{fill:#c9ced6; fill:color-mix(in srgb, var(--lc) 55%, #eef0f2); stroke-width:0}
.lg.show.core{opacity:1}
.lg.core .lab{fill:var(--cream); font-weight:600}
.hovering .lg.show{opacity:0}
.hovering .lg.hl{opacity:1}
.lgbg{fill:var(--bg); fill-opacity:0.86}
.lg.over:not(.hl) .lgbg{fill-opacity:0.5}
/* Name im großen Punkt: ohne Unterlage, dunkel auf der Füllung, hell im Ring */
.lg.in .lgbg{display:none}
.lg.in .lab,.lg.in.hl .lab,.lg.in.me .lab{fill:#12151b; stroke-width:0; font-weight:600}
.lg.in.hollow .lab,.lg.in.hollow.hl .lab{fill:var(--cream)}
/* Beim Zeigen: der Punkt selbst als helle Pille, Nachbarn in ihrer Farbe auf dunkler Pille */
.lg.hl .lgbg{fill:var(--panel); fill-opacity:1; stroke:var(--lc); stroke-opacity:0.6; stroke-width:1;
  vector-effect:non-scaling-stroke}
.lg.hl .lab{fill:var(--lc); stroke-width:0; font-weight:600}
.lg.me .lgbg{fill:var(--cream); stroke:none}
.lg.me .lab{fill:#14181f; font-weight:700}
/* Kern und Wachstum */
.halo{fill:var(--c); opacity:0.24; pointer-events:none}
.corering{fill:none; stroke:var(--cream); stroke-width:1.4; vector-effect:non-scaling-stroke; pointer-events:none}
.rise{fill:var(--cream); pointer-events:none}
.m-dots .node.dim,.m-all .node.dim{opacity:0.13}
.m-dots.hovering .node.dim.cur,.m-dots.hovering .node.dim.nb,.m-all.hovering .node.dim.cur,.m-all.hovering .node.dim.nb{opacity:0.6}

/* ---------- Layout 2b: Abteilung als Liste, Themen als Spalten ---------- */
function layoutShelf(d){
  var ar = deptArea(), narrow = W < 700, f = filt(d), fo = filtOn(d);
  var RH = 18, HEAD = 40, BGAP = 26, CW = 262, CG = 30;
  var blocks = GROUPS[d].map(function(g){
    var list = NODES.filter(function(n){ return n.dept === d && n.grp === g && passes(n); }).sort(rowSort);
    return {g:g, list:list, h:HEAD + list.length * RH + BGAP};
  }).filter(function(bl){ return bl.list.length; });
  function masonry(nc){
    var cols = []; for (var i = 0; i < nc; i++) cols.push({h:0, bl:[]});
    blocks.forEach(function(bl){
      var c = cols.reduce(function(m, x){ return x.h < m.h - 0.5 ? x : m; }, cols[0]);
      c.bl.push({bl:bl, y:c.h}); c.h += bl.h; });
    return cols;
  }
  var best = blocks.length ? null : {cols:[], w:CW, h:60, k:1};      // kein Treffer: leere Liste mit Hinweis
  for (var nc = 1; nc <= blocks.length; nc++){
    var cols = masonry(nc), w = nc * CW + (nc - 1) * CG;
    var h = Math.max.apply(null, cols.map(function(c){ return c.h; })) + 10;
    var k = narrow ? Math.min(1, ar.w / w) : Math.min(ar.w / w, ar.h / h, 1.15);
    if (narrow && nc > 1 && ar.w / w < 0.9) break;

  var items = [], heads = [], b = box();
  best.cols.forEach(function(c, ci){
    var bx = x0 + ci * (CW + CG);
    c.bl.forEach(function(p){
      var by = y0 + p.y;
      heads.push({g:p.bl.g, n:p.bl.list.length, x:bx, y:by, w:CW});
      p.bl.list.forEach(function(n, i){
        items.push({n:n, x:bx + 8, y:by + HEAD + i * RH + RH / 2 - 4, r:rad(n, 'row'), lab:'row', cw:CW, col:tcol(n)});
      });
    });

    var A = keep[l.source], B = keep[l.target]; if (!A || !B) return;
    edges.push({a:A, b:B, l:l, cls:l.origin === 'WIKILINK' ? 'wl' : ''});
  });

    curve:function(e){

      if (Math.abs(a.x - c.x) >= 1 && a.cw){
        if (c.x < a.x){ var t = a; a = c; c = t; }
        var sx = a.x + a.cw - 6, ex = c.x - 9, m2 = (sx + ex) / 2;
        return 'M' + f1(sx) + ',' + f1(a.y) + 'C' + f1(m2) + ',' + f1(a.y) + ' ' + f1(m2) + ',' + f1(c.y) +
          ' ' + f1(ex) + ',' + f1(c.y);
      }
      if (Math.abs(a.x - c.x) < 1){
        var cx = a.x - 12 - Math.abs(a.y - c.y) * 0.2;
        return 'M' + f1(a.x) + ',' + f1(a.y) + 'C' + f1(cx) + ',' + f1(a.y) + ' ' + f1(cx) + ',' + f1(c.y) +
          ' ' + f1(c.x) + ',' + f1(c.y);
      }
      var mx = (a.x + c.x) / 2;
      return 'M' + f1(a.x) + ',' + f1(a.y) + 'C' + f1(mx) + ',' + f1(a.y) + ' ' + f1(mx) + ',' + f1(c.y) +
        ' ' + f1(c.x) + ',' + f1(c.y);

    cam:function(){ return fitCam(b, deptArea(), narrow ? {widthOnly:true, kMax:1} : {kMax:1.15}); }};

function layoutFocus(id){

    var A = byId[a], B = byId[b];
    return DEPTS.indexOf(A.dept) - DEPTS.indexOf(B.dept) || gIdx(A) - gIdx(B) ||
      A.short.localeCompare(B.short); });
  var slot = {}, s = 0, prev = null, segs = [];
  ids.forEach(function(x){
    var d = byId[x].dept;

  });
  var keep = {}; items.forEach(function(it){ keep[it.n.id] = it; });
  var edges = [];
  ids.forEach(function(x){
    var r = rel[x], all = r.o.concat(r.i);

window.addEventListener('pointermove', function(e){
  if (!down) return;
  var dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (!dragged && Math.abs(dx) + Math.abs(dy) > 5){ dragged = true; stage.classList.add('drag'); hoverOff(); }
  if (dragged){ cam.x = down.cx + dx; cam.y = down.cy + dy; applyCam(); }
});
window.addEventListener('pointerup', function(){
  down = null; stage.classList.remove('drag');
  setTimeout(function(){ dragged = false; }, 0);
});
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  var r = svg.getBoundingClientRect();
  if (e.shiftKey){ cam.x -= e.deltaY; applyCam(); return; }          // Umschalt + Rad: seitwärts
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
}, {passive:false});

var pinch = null;
stage.addEventListener('touchstart', function(e){
  if (e.touches.length === 2){
    var a = e.touches[0], b = e.touches[1];
    pinch = {d:Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)}; down = null;
  }
}, {passive:true});
stage.addEventListener('touchmove', function(e){
  if (pinch && e.touches.length === 2){
    e.preventDefault();
    var a = e.touches[0], b = e.touches[1], r = svg.getBoundingClientRect();
    var d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    zoomAt((a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top, d / pinch.d);
    pinch.d = d;
  }
}, {passive:false});
stage.addEventListener('touchend', function(){ pinch = null; }, {passive:true});

document.addEventListener('click', function(e){
  document.getElementById('tinfo').classList.remove('open');
  var c = e.target.closest('[data-close]');
  if (c){ close(c.parentNode.id); return; }
  var cp = e.target.closest('[data-copy]');
  if (cp){ var p = cp.getAttribute('data-copy');
    if (navigator.clipboard) navigator.clipboard.writeText(p).then(function(){ cp.textContent = 'Kopiert'; },
      function(){ cp.textContent = 'Kopieren nicht erlaubt'; });
    return; }
  var cr = e.target.closest('[data-crumb]');
  if (cr){ var parts = document.getElementById('crumbs').__parts, i = +cr.getAttribute('data-crumb');
    if (parts && parts[i] && parts[i].s) go(parts[i].s); return; }
  if (e.target.closest('#fbtn')){ panelOpen() ? closePanel() : openPanel(); return; }
  var fs = e.target.closest('[data-fst]');
  if (fs){ var v1 = fs.getAttribute('data-fst'); if (FST[v1]) delete FST[v1]; else FST[v1] = true; applyFilter(); return; }
  var fa = e.target.closest('[data-fage]');
  if (fa){ var v2 = fa.getAttribute('data-fage'); FAGE = FAGE === v2 ? '' : v2; applyFilter(); return; }
  var fm = e.target.closest('[data-fmin]');
  if (fm){ var v3 = fm.getAttribute('data-fmin'); FMIN = FMIN === v3 ? '' : v3; applyFilter(); return; }
  var ft = e.target.closest('[data-ftheme]');
  if (ft){ var pp = ft.getAttribute('data-ftheme').split('|'), fd = FILT[pp[0]] = FILT[pp[0]] || {};
    if (fd[pp[1]]) delete fd[pp[1]]; else fd[pp[1]] = true; applyFilter(); return; }
  if (e.target.closest('[data-freset]')){ resetFilter(); return; }
  if (e.target.closest('[data-fclose]')){ closePanel(); return; }
  if (panelOpen() && !e.target.closest('#fpanel')) closePanel();
  var ar = e.target.closest('[data-arr]');
  if (ar){ setArr(ar.getAttribute('data-arr')); return; }
  var th = e.target.closest('[data-theme]');
  if (th){ toggleTheme(th.getAttribute('data-theme')); return; }
  var g = e.target.closest('[data-go]');
  if (g){ close('reg'); select(g.getAttribute('data-go')); }
});
document.getElementById('back').addEventListener('click', back);
document.getElementById('prev').addEventListener('click', function(){ step(-1); });
document.getElementById('next').addEventListener('click', function(){ step(1); });
document.getElementById('register').addEventListener('click', function(){
  close('detail'); renderRegister(''); document.getElementById('q').value = ''; open('reg');
  document.getElementById('q').focus(); });
document.getElementById('q').addEventListener('input', function(e){ renderRegister(e.target.value); });
/* Suche im Graphen: alle Wörter müssen vorkommen, Groß/Klein und Umlaute egal; Enter bei einem Treffer öffnet ihn */
var fqT = null;
function setQ(v){ FQ = norm(v).split(/\s+/).filter(Boolean); applyFilter(); }
document.getElementById('fq').addEventListener('input', function(e){
  clearTimeout(fqT); var v = e.target.value; fqT = setTimeout(function(){ setQ(v); }, 160); });
document.getElementById('fq').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  clearTimeout(fqT); setQ(e.target.value);
  var hits = scopeNodes().filter(passes);
  if (FQ.length && hits.length === 1){ e.target.blur(); select(hits[0].id); }
});
document.getElementById('zin').addEventListener('click', function(){ zoomAt(W / 2, H / 2, 1.3); });
document.getElementById('zout').addEventListener('click', function(){ zoomAt(W / 2, H / 2, 1 / 1.3); });
document.getElementById('zfit').addEventListener('click', function(){
  if (cur){ camT = cur.L.cam(); cam = {k:camT.k, x:camT.x, y:camT.y}; applyCam(); } });

document.addEventListener('keydown', function(e){
  var typing = e.target && e.target.tagName === 'INPUT';
  if (e.key === 'Escape'){
    if (panelOpen()){ closePanel(); return; }
    if (e.target && e.target.id === 'fq'){
      if (e.target.value || FQ.length){ e.target.value = ''; clearTimeout(fqT); setQ(''); } else e.target.blur();
      return; }
    var d = document.getElementById('detail'), r = document.getElementById('reg');
    if (r.classList.contains('on')) close('reg');
    else if (d.classList.contains('on')) close('detail');
    else if (view.mode !== 'all') back();
    return;
  }
  if (typing) return;
  if (e.key === 'Backspace'){ e.preventDefault(); back(); return; }
  if (e.key === '/'){ e.preventDefault(); document.getElementById('register').click(); return; }
  if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.3);
  if (e.key === '-') zoomAt(W / 2, H / 2, 1 / 1.3);
  if (e.key === '0') document.getElementById('zfit').click();
  if (view.mode === 'dept' && !document.getElementById('reg').classList.contains('on')){
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  }
});
var rt; window.addEventListener('resize', function(){
  clearTimeout(rt); rt = setTimeout(function(){ placeFgrp(); render(false); if (panelOpen()) placePanel(); }, 160); });

/* Für Bildschirmfotos: Übergänge sofort abschließen */
window.__freeze = function(){
  STILL = true; document.documentElement.classList.add('frozen');
  render(false);
};
window.__view = function(v){ go(v, {instant:true}); };
window.__arr = function(a){ ARR = a; render(false); };
window.__theme = function(g){ toggleTheme(g); };
window.__filter = function(o){ o = o || {}; FQ = o.q ? norm(o.q).split(/\s+/).filter(Boolean) : []; FST = o.st || {};
  FAGE = o.age || ''; FMIN = o.min || ''; FILT = o.themes || {}; document.getElementById('fq').value = o.q || '';
  applyFilter(); return scopeNodes().filter(passes).length; };

/* ---------- Live: Nerven und Impulse ---------- */
function applyLive(changed){
  if (!cur || !cur.ready) return;
  var by = {};
  cur.L.items.forEach(function(it){ by[it.n.id] = it;
    var k = liveOf(it.n.id), h = it.g.querySelector('.lhalo');
    it.g.classList.toggle('lw', k === 'work'); it.g.classList.toggle('lu', k === 'use');
    if (k && !h && it.lab !== 'row') it.g.insertBefore(el('circle', {class:'lhalo', r:f1(it.r + 6)}), it.g.children[1] || null);
    else if (!k && h) h.parentNode.removeChild(h);
  });
  buildNerves(by);
  liveBox();
  if (changed) declutter();
}
function buildNerves(by){
  var g = cur.nv, L = cur.L;
  while (g.firstChild) g.removeChild(g.firstChild);
  NERVES = [];
  if (L.mode === 'dept' && !L.dots) return;                 // Regal: Zeilen statt Raum, dort keine Nerven
  LIVE.forEach(function(s, si){
    var h = by[s.home]; if (!h) return;
    var col = COLOR[byId[s.home].dept];
    Object.keys(s.nodes).forEach(function(id, j){
      var t = by[id]; if (!t || id === s.home || CHAIN[id]) return;
      var x0 = h.x, y0 = h.y, x1 = t.x, y1 = t.y, dx = x1 - x0, dy = y1 - y0, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 4) return;
      var bend = (j % 2 ? 1 : -1) * Math.min(0.2 * d, 80), cx = (x0 + x1) / 2 - dy / d * bend, cy = (y0 + y1) / 2 + dx / d * bend;
      var path = 'M' + f1(x0) + ',' + f1(y0) + 'Q' + f1(cx) + ',' + f1(cy) + ' ' + f1(x1) + ',' + f1(y1);
      var work = s.nodes[id] === 'work', dim = fOn() && (h.dim || t.dim) ? ' dim' : '';
      g.appendChild(el('path', {class:'nglow' + dim, d:path, stroke:col}));
      g.appendChild(el('path', {class:'nerve' + (work ? ' w' : '') + dim, d:path, stroke:col}));
      var pts = [], cum = [0];
      for (var i = 0; i <= 32; i++){ var u = i / 32, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
        pts.push([a * x0 + b * cx + c * x1, a * y0 + b * cy + c * y1]); }
      if (!work) pts.reverse();
      for (i = 1; i <= 32; i++) cum.push(cum[i - 1] + Math.sqrt(Math.pow(pts[i][0] - pts[i - 1][0], 2) + Math.pow(pts[i][1] - pts[i - 1][1], 2)));
      var dT = 'M' + f1(pts[0][0]) + ',' + f1(pts[0][1]) + 'Q' + f1(cx) + ',' + f1(cy) + ' ' + f1(pts[32][0]) + ',' + f1(pts[32][1]);
      /* Schweif: ein Strichstück entlang der Kurve, Verlauf von durchsichtig im Nervton zu hell am Kopf */
      var gid = 'nvg' + NERVES.length, gr = el('linearGradient', {id:gid, gradientUnits:'userSpaceOnUse'});
      gr.appendChild(el('stop', {offset:0, 'stop-color':col, 'stop-opacity':0}));
      gr.appendChild(el('stop', {offset:0.55, 'stop-color':col, 'stop-opacity':0.55}));
      gr.appendChild(el('stop', {offset:1, 'stop-color':'#fff6e4', 'stop-opacity':0.95}));
      var tl = el('path', {class:'trail' + dim, d:dT, stroke:'url(#' + gid + ')'});
      var sp = el('g', {class:'spark' + dim, fill:col});
      sp.appendChild(el('circle', {class:'sh', r:8})); sp.appendChild(el('circle', {class:'sc', r:2.3}));
      g.appendChild(gr); g.appendChild(tl); g.appendChild(sp);
      NERVES.push({pts:pts, cum:cum, tl:tl, gr:gr, sp:sp, ph:rnd(si * 7.13 + j * 3.31 + 1), dur:2600 + Math.min(d, 900) * 2});
    });
  });
  if (!pulseT && NERVES.length && !STILL) pulseT = requestAnimationFrame(pulse);
}
/* Ein Impuls je Nerv: Kopf mit Hof und Schweif mit Verlauf, 70 % der Periode unterwegs,
   dann Pause; Größen bleiben am Bildschirm gleich */
function sparks(now){
  var k = cam.k, sc = ' scale(' + (1 / k).toFixed(3) + ')', wt = (2.4 / k).toFixed(2);
  NERVES.forEach(function(n){
    var v = ((now / n.dur + n.ph) % 1) / 0.7;
    if (v > 1){ n.sp.style.opacity = n.tl.style.opacity = 0; return; }
    var e = v < 0.5 ? 2 * v * v : 1 - 2 * (1 - v) * (1 - v), f = e * 32, i = Math.min(31, Math.floor(f)), r = f - i;
    var p = n.pts[i], q = n.pts[i + 1], s = n.cum[i] + (n.cum[i + 1] - n.cum[i]) * r, tot = n.cum[32];
    var o = 0.15 + 0.85 * Math.sin(v * Math.PI);
    n.sp.setAttribute('transform', 'translate(' + f1(p[0] + (q[0] - p[0]) * r) + ',' + f1(p[1] + (q[1] - p[1]) * r) + ')' + sc);
    n.sp.style.opacity = o.toFixed(2);
    var a = Math.min(64 / k, tot * 0.4, s), t0 = atLen(n, s - a);
    tail(n.tl, a, s, tot, wt, o);
    n.gr.setAttribute('x1', f1(t0[0])); n.gr.setAttribute('y1', f1(t0[1]));
    n.gr.setAttribute('x2', f1(p[0] + (q[0] - p[0]) * r)); n.gr.setAttribute('y2', f1(p[1] + (q[1] - p[1]) * r));
  });
}
function atLen(n, L){
  var c = n.cum, i = 0;
  while (i < 31 && c[i + 1] < L) i++;
  var r = c[i + 1] > c[i] ? clamp((L - c[i]) / (c[i + 1] - c[i]), 0, 1) : 0, p = n.pts[i], q = n.pts[i + 1];
  return [p[0] + (q[0] - p[0]) * r, p[1] + (q[1] - p[1]) * r];
}
function tail(el2, a, s, tot, w, o){
  el2.setAttribute('stroke-dasharray', f1(a) + ' ' + f1(tot + a + 1)); el2.setAttribute('stroke-dashoffset', f1(a - s));
  el2.setAttribute('stroke-width', w); el2.style.opacity = o.toFixed(2);
}
function pulse(now){
  pulseT = null;
  if (!NERVES.length || STILL) return;
  sparks(now);
  pulseT = requestAnimationFrame(pulse);
}
function liveBox(){
  var i = document.getElementById('livei'), b = document.getElementById('livebox');
  if (!LIVE.length || ACT){ i.hidden = true; toggleLive(false); return; }   // mit Aktivitaetsschicht zeigt die Server-Ansicht die Sitzungen selbst
  i.hidden = false;
  var head = LIVE.length === 1 ? '1 Sitzung läuft' : LIVE.length + ' Sitzungen laufen';
  document.getElementById('liven').textContent = LIVE.length; i.title = head; i.setAttribute('aria-label', head);
  b.innerHTML = '<div class="lh">' + head + '</div>' + LIVE.slice(0, 8).map(function(s){
    var h = byId[s.home], w = 0, u = 0;
    Object.keys(s.nodes).forEach(function(id){ if (id !== s.home && !CHAIN[id]) { if (s.nodes[id] === 'work') w++; else u++; } });
    var m = [shortName(h)];
    if (w) m.push(w + ' bearbeitet');
    if (u) m.push(u + ' benutzt');
    if (s.idle_min) m.push('vor ' + s.idle_min + ' min');
    return '<button class="lrow" data-go="' + esc(s.home) + '"><i style="background:' + COLOR[h.dept] + '"></i>' +
      '<span class="lt">' + esc(s.title || shortName(h)) + '</span><span class="lm">' + esc(m.join(' · ')) + '</span></button>';
  }).join('') + '<p class="lnote">Linien führen von einer Sitzung zu dem, was sie in der letzten halben Stunde benutzt hat. ' +
    'Impulse laufen beim Schreiben hinaus, beim Lesen hinein.</p>';
  if (!b.hidden) placeLive();
}
function placeLive(){
  var q = document.getElementById('livei').getBoundingClientRect(), b = document.getElementById('livebox');
  b.style.top = f1(q.bottom + 8) + 'px'; b.style.left = f1(clamp(q.left, 12, innerWidth - b.offsetWidth - 12)) + 'px';
}
function toggleLive(on){
  var b = document.getElementById('livebox');
  b.hidden = !on; document.getElementById('livei').setAttribute('aria-expanded', String(!!on));
  if (on) placeLive();
}
document.getElementById('livei').addEventListener('click', function(){ toggleLive(document.getElementById('livebox').hidden); });
document.getElementById('livebox').addEventListener('click', function(e){
  var r = e.target.closest('.lrow'); if (r){ toggleLive(false); select(r.getAttribute('data-go')); }
});
document.addEventListener('pointerdown', function(e){
  if (!document.getElementById('livebox').hidden && !e.target.closest('#livebox, #livei')) toggleLive(false); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggleLive(false); });
window.__aktivDaten = function(d){
  var ok = d && d.at && Date.now() - Date.parse(d.at) < 5 * 60e3;
  LIVE = (ok && d.sessions || []).filter(function(s){ return s && byId[s.home]; });
  LIVE.forEach(function(s){ var o = {}; Object.keys(s.nodes || {}).forEach(function(id){ if (byId[id]) o[id] = s.nodes[id]; });
    s.nodes = o; });
  applyLive(true);
};
function pollLive(){
  if (ACT || document.visibilityState === 'hidden') return;
  var sc = document.createElement('script');
  sc.src = 'aktiv.js?t=' + Date.now();
  sc.onload = function(){ sc.parentNode.removeChild(sc); };
  sc.onerror = function(){ sc.parentNode.removeChild(sc); if (LIVE.length){ LIVE = []; applyLive(true); } };
  document.head.appendChild(sc);
}
/* Server-Ansicht: meldet laufende Knoten ohne Sitzungen; jedes laufende Projekt wird zur Wurzel der übrigen */
if (ACT) (function(){ var homes = [], used = {};
  Object.keys(ACTN).forEach(function(id){ if (!ACTN[id].live || !byId[id]) return;
    if (byId[id].kind === 'projekt') homes.push(id); else used[id] = 'use'; });
  LIVE = homes.map(function(h){ var o = {}; Object.keys(used).forEach(function(u){ o[u] = 'use'; }); o[h] = 'work';
    return {title:'', home:h, nodes:o, idle_min:0}; });
})();
window.__sparks = function(t){ sparks(t); };

go({mode:'all'}, {noPush:true, instant:true});
pollLive(); setInterval(pollLive, 30e3);
document.addEventListener('visibilitychange', pollLive);
})();
</script>
